<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Mi Perfil</title>

    <!-- Boostrap core css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- custom style -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>
<div th:if="${session.USUARIO != null}" th:replace="~{fragments/encabezado :: encabezado}"></div>

<main role="main" class="container pb-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Mi Perfil</h1>
        <a th:href="@{/}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver
        </a>
    </div>

    <!-- Actualizar datos -->
    <section class="card mb-4">
        <div class="card-header">
            <span class="fw-semibold">Datos personales</span>
        </div>
        <div class="card-body">
            <div th:if="${mensajeExitoDatos != null}" class="alert alert-success" th:text="${mensajeExitoDatos}"></div>
            <div th:if="${errorDatos != null}" class="alert alert-danger" th:text="${errorDatos}"></div>

            <form th:action="@{/perfil/datos}" method="post">
                <div class="mb-3">
                    <label for="nombreUsuario" class="form-label">Nombre de usuario</label>
                    <input type="text" id="nombreUsuario" name="nombreUsuario" class="form-control"
                           th:value="${usuario != null ? usuario.nombreUsuario : ''}" required />
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" id="email" name="email" class="form-control"
                           th:value="${usuario != null ? usuario.email : ''}" required />
                </div>

                <button type="submit" class="btn btn-primary">Guardar datos</button>
            </form>
        </div>
    </section>

    <!-- Cambiar contraseña -->
    <section class="card">
        <div class="card-header">
            <span class="fw-semibold">Cambiar contraseña</span>
        </div>
        <div class="card-body">
            <div th:if="${mensajeExitoPassword != null}" class="alert alert-success" th:text="${mensajeExitoPassword}"></div>
            <div th:if="${errorPassword != null}" class="alert alert-danger" th:text="${errorPassword}"></div>

            <form th:action="@{/perfil/password}" method="post">
                <div class="mb-3">
                    <label for="passwordActual" class="form-label">Contraseña actual</label>
                    <input type="password" id="passwordActual" name="passwordActual" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label for="passwordNueva" class="form-label">Nueva contraseña</label>
                    <input type="password" id="passwordNueva" name="passwordNueva" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label for="confirmacionPassword" class="form-label">Confirmar nueva contraseña</label>
                    <input type="password" id="confirmacionPassword" name="confirmacionPassword" class="form-control" required />
                </div>

                <button type="submit" class="btn btn-primary">Actualizar contraseña</button>
            </form>
        </div>
    </section>
</main>

<!-- Boostrap core js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
