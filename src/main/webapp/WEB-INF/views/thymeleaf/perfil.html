<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" th:href="@{/css/general.css}" />
    <link rel="stylesheet" th:href="@{/css/encabezado.css}" />
    <link rel="stylesheet" th:href="@{/css/home-eventos.css}" />
</head>
<body>
<!-- HEADER -->
<th:block th:replace="~{fragments/encabezado :: encabezado}"></th:block>

<!-- MAIN -->
<main>
    <section class="hero py-5">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <h1 class="fw-bold mb-1">Mi Perfil</h1>
                    <p class="mb-0">Administrá tus datos personales y la seguridad de tu cuenta.</p>
                </div>
                <a th:href="@{/home-eventos}" class="btn btn-outline-light rounded-pill px-4">
                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver
                </a>
            </div>

            <div class="row g-4">
                <!-- DATOS PERSONALES -->
                <div class="col-12 col-lg-6">
                    <div class="bg-white text-dark p-4 rounded-4 hero-search h-100">
                        <h2 class="h5 fw-bold mb-3">
                            <i class="bi bi-person-circle me-2" aria-hidden="true"></i>Datos personales
                        </h2>

                        <div th:if="${mensajeExitoDatos != null}" class="alert alert-success" th:text="${mensajeExitoDatos}"></div>
                        <div th:if="${errorDatos != null}" class="alert alert-danger" th:text="${errorDatos}"></div>

                        <form th:action="@{/perfil/datos}" method="post">
                            <div class="mb-3">
                                <label for="nombreUsuario" class="form-label">Nombre de usuario</label>
                                <input
                                        type="text"
                                        id="nombreUsuario"
                                        name="nombreUsuario"
                                        class="form-control"
                                        th:value="${usuario != null ? usuario.nombreUsuario : ''}"
                                        required
                                />
                            </div>

                            <div class="mb-4">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        class="form-control"
                                        th:value="${usuario != null ? usuario.email : ''}"
                                        required
                                />
                            </div>

                            <button type="submit" class="btn btn-buscar rounded-pill px-4">
                                <i class="bi bi-check2-circle me-1" aria-hidden="true"></i>Guardar datos
                            </button>
                        </form>
                    </div>
                </div>

                <!-- CAMBIAR CONTRASEÑA -->
                <div class="col-12 col-lg-6">
                    <div class="bg-white text-dark p-4 rounded-4 hero-search h-100">
                        <h2 class="h5 fw-bold mb-3">
                            <i class="bi bi-shield-lock me-2" aria-hidden="true"></i>Cambiar contraseña
                        </h2>

                        <div th:if="${mensajeExitoPassword != null}" class="alert alert-success" th:text="${mensajeExitoPassword}"></div>
                        <div th:if="${errorPassword != null}" class="alert alert-danger" th:text="${errorPassword}"></div>

                        <form th:action="@{/perfil/password}" method="post">
                            <div class="mb-3">
                                <label for="passwordActual" class="form-label">Contraseña actual</label>
                                <input
                                        type="password"
                                        id="passwordActual"
                                        name="passwordActual"
                                        class="form-control"
                                        required
                                />
                            </div>

                            <div class="mb-3">
                                <label for="passwordNueva" class="form-label">Nueva contraseña</label>
                                <input
                                        type="password"
                                        id="passwordNueva"
                                        name="passwordNueva"
                                        class="form-control"
                                        required
                                />
                            </div>

                            <div class="mb-4">
                                <label for="confirmacionPassword" class="form-label">Confirmar nueva contraseña</label>
                                <input
                                        type="password"
                                        id="confirmacionPassword"
                                        name="confirmacionPassword"
                                        class="form-control"
                                        required
                                />
                            </div>

                            <button type="submit" class="btn btn-buscar rounded-pill px-4">
                                <i class="bi bi-key me-1" aria-hidden="true"></i>Actualizar contraseña
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>
</html>
