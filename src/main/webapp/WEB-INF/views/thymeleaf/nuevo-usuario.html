<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta | Eventos</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/encabezado.css}" />
    <link rel="stylesheet" th:href="@{/css/home-eventos.css}" />
    <link rel="stylesheet" th:href="@{/css/acceso.css}" />
</head>
<body>

<th:block th:replace="~{fragments/encabezado :: encabezado}"></th:block>

<main class="container py-5">
    <div class="acceso">
        <section class="acceso-panel">
            <h2>Armá tu evento y reservalo online</h2>
            <p>Con tu cuenta guardás tus reservas, pagás la seña y abonás el resto cuando quieras.</p>
            <img th:src="@{/img/salon.jpg}" class="acceso-imagen" alt="" />
        </section>

        <section class="acceso-form">
            <h1>Creá tu cuenta</h1>

            <p th:if="${error != null}" class="alert alert-danger" role="alert" th:text="${error}"></p>

            <form th:action="@{/registrarme}" method="POST" accept-charset="UTF-8" th:object="${datosRegistro}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input th:field="*{email}" id="email" type="email" class="form-control"
                           autocomplete="email" required />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input th:field="*{password}" id="password" type="password" class="form-control"
                           autocomplete="new-password" required />
                </div>
                <div class="mb-4">
                    <label for="confirmacionPassword" class="form-label">Repetí la contraseña</label>
                    <input th:field="*{confirmacionPassword}" id="confirmacionPassword" type="password"
                           class="form-control" autocomplete="new-password" required
                           aria-describedby="ayuda-confirmacion" />
                    <div id="ayuda-confirmacion" class="acceso-ayuda">Tiene que ser igual a la anterior.</div>
                </div>

                <button id="btn-registrarme" type="submit" class="btn btn-buscar w-100 rounded-pill">
                    Crear cuenta
                </button>
            </form>

            <p class="acceso-alternativa">
                ¿Ya tenés cuenta?
                <a th:href="@{/login}">Ingresá</a>
            </p>
        </section>
    </div>
</main>

</body>
</html>
