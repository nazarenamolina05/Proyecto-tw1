<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis reservas</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/reservas.css}" />
</head>
<body>

<header class="encabezado py-3">
    <nav class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/home-eventos}" class="text-white text-decoration-none fw-bold">Eventos</a>
        <a th:href="@{/mis-reservas}" class="text-white text-decoration-none">Mis reservas</a>
    </nav>
</header>

<main class="container py-5">
    <div class="linea-titulo mb-2"></div>
    <h1 class="mb-4">Mis reservas</h1>

    <p th:if="${reservas.isEmpty()}" class="text-muted">
        Todavía no tenés reservas. Explorá los paquetes disponibles y organizá tu próximo evento.
    </p>

    <div class="row g-4" th:if="${not reservas.isEmpty()}">
        <div class="col-md-6 col-lg-4" th:each="reserva : ${reservas}">
            <div class="card h-100 tarjeta-reserva">
                <div class="card-body">
                    <h5 class="card-title" th:text="${reserva.nombrePaquete}"></h5>
                    <p class="card-text mb-1">
                        <strong>Fecha:</strong> <span th:text="${reserva.fecha}"></span>
                    </p>
                    <p class="card-text mb-3">
                        <strong>Presupuesto:</strong> $<span th:text="${reserva.presupuesto}"></span>
                    </p>
                    <span class="badge-estado" th:classappend="${'estado-' + reserva.estado}"
                          th:text="${reserva.estado}"></span>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
