<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle del paquete</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/home-eventos.css}" />
    <link rel="stylesheet" th:href="@{/css/paquete-detalle.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" />
</head>
<body>

<header class="encabezado py-3">
    <div class="container">
        <nav class="d-flex justify-content-between align-items-center">
            <a th:href="@{/home-eventos}" class="text-light text-decoration-none fw-bold">Eventos</a>
            <a th:href="@{/home-eventos#packs}" class="text-light text-decoration-none">Volver a los packs</a>
        </nav>
    </div>
</header>

<main class="seccion-clara py-5">
    <div class="container">

        <div th:if="${paquete != null}" class="card detalle-card">
            <div class="row g-0">

                <div class="col-lg-6">
                    <img th:src="@{/img/salon.jpg}" class="detalle-img" th:alt="${paquete.nombre}" />
                </div>

                <div class="col-lg-6 p-4 p-lg-5 d-flex flex-column">

                    <h1 class="fw-bold mb-4" th:text="${paquete.nombre}">Nombre del paquete</h1>

                    <h5 class="fw-bold">Qué incluye</h5>
                    <ul class="detalle-lista mb-4">
                        <li th:text="${paquete.salon.nombre}">Salón</li>
                        <li th:text="${paquete.catering}">Catering</li>
                        <li th:each="servicio : ${paquete.serviciosAdicionales}" th:text="${servicio}">Servicio</li>
                    </ul>

                    <div class="detalle-precio">
                        <small>Precio estimado</small>
                        <div class="monto">
                            $ <span th:text="${#numbers.formatDecimal(paquete.precioEstimado, 0, 'POINT', 0, 'COMMA')}">0</span>
                        </div>
                    </div>

                    <div th:if="${error}" class="alert alert-danger mt-3 mb-0" role="alert" th:text="${error}">
                        Error
                    </div>
                    <div th:if="${mensajeExito}" class="alert alert-success mt-3 mb-0" role="alert" th:text="${mensajeExito}">
                        Todo listo
                    </div>

                    <form th:action="@{/paquetes-predeterminados/{id}/reservar(id=${paquete.id})}"
                          method="post" class="mt-3">

                        <div class="mb-3">
                            <label for="tipoEvento" class="form-label fw-bold">Tipo de evento</label>
                            <select id="tipoEvento" name="tipoEvento" class="form-select" required>
                                <option value="">Seleccioná un tipo</option>
                                <th:block th:each="tipo : ${tiposEvento}" th:switch="${tipo.name()}">
                                    <option th:case="'CUMPLEANIOS'" th:value="${tipo.name()}"
                                            th:selected="${tipoSeleccionado == tipo}">Cumpleaños</option>
                                    <option th:case="'FIESTA_DE_15'" th:value="${tipo.name()}"
                                            th:selected="${tipoSeleccionado == tipo}">Fiesta de 15</option>
                                    <option th:case="'CASAMIENTO'" th:value="${tipo.name()}"
                                            th:selected="${tipoSeleccionado == tipo}">Casamiento</option>
                                    <option th:case="'EMPRESARIAL'" th:value="${tipo.name()}"
                                            th:selected="${tipoSeleccionado == tipo}">Empresarial</option>
                                </th:block>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="fecha" class="form-label fw-bold">Fecha del evento</label>
                            <input id="fecha" name="fecha" type="text" class="form-control"
                                   placeholder="Elegí una fecha" th:value="${fechaSeleccionada}"
                                   required readonly />
                        </div>

                        <div class="mb-3">
                            <label for="cantidadInvitados" class="form-label fw-bold">
                                Cantidad de invitados
                                <span class="text-muted fw-normal">(hasta <span th:text="${capacidad}">50</span>)</span>
                            </label>
                            <input id="cantidadInvitados" name="cantidadInvitados" type="number"
                                   class="form-control" min="1" th:max="${capacidad}"
                                   th:value="${invitadosSeleccionados}" required />
                        </div>

                        <button type="submit" class="btn btn-pack w-100 rounded-pill">Reservar</button>
                    </form>

                </div>
            </div>
        </div>

        <div th:if="${paquete == null}" class="text-center py-5">
            <h2 class="fw-bold">No encontramos ese paquete</h2>
            <a th:href="@{/home-eventos#packs}" class="btn btn-pack rounded-pill px-4 mt-3">
                Ver los packs disponibles
            </a>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/es.js"></script>

<script th:inline="javascript">
    const fechasOcupadas = /*[[${fechasOcupadas}]]*/ [];

    if (document.getElementById("fecha")) {
        flatpickr("#fecha", {
            locale: "es",
            dateFormat: "Y-m-d",
            minDate: new Date().fp_incr(1),
            disable: fechasOcupadas || [],
            onDayCreate: function (dObj, dStr, fp, dayElem) {
                const iso = fp.formatDate(dayElem.dateObj, "Y-m-d");
                if ((fechasOcupadas || []).includes(iso)) {
                    dayElem.classList.add("dia-ocupado");
                    dayElem.title = "Fecha ocupada";
                }
            }
        });
    }
</script>

</body>
</html>
