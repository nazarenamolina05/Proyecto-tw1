<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresar | Eventos</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" th:href="@{/css/general.css}" />
    <link rel="stylesheet" th:href="@{/css/encabezado.css}" />
    <link rel="stylesheet" th:href="@{/css/home-eventos.css}" />
    <link rel="stylesheet" th:href="@{/css/acceso.css}" />
</head>
<body>

<th:block th:replace="~{fragments/encabezado :: encabezado}"></th:block>

<main class="container py-5">
    <div class="acceso">
        <section class="acceso-panel">
            <h2>Tus eventos, en un solo lugar</h2>
            <p>Ingresá para reservar, pagar la seña y seguir el estado de cada reserva.</p>
            <img th:src="@{/img/salon.jpg}" class="acceso-imagen" alt="" />
        </section>

        <section class="acceso-form">
            <h1>Ingresá a tu cuenta</h1>

            <p th:if="${error != null}" class="alert alert-danger" role="alert" th:text="${error}"></p>

            <form th:action="@{/validar-login}" method="POST" accept-charset="UTF-8" th:object="${datosLogin}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input th:field="*{email}" id="email" type="email" class="form-control"
                           autocomplete="email" required />
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input th:field="*{password}" id="password" type="password" class="form-control"
                           autocomplete="current-password" required />
                </div>

                <!-- login.js lo habilita cuando email y contraseña tienen texto -->
                <button id="btn-login" type="submit" class="btn btn-buscar w-100 rounded-pill" disabled>
                    Ingresar
                </button>
            </form>

            <p class="acceso-alternativa">
                ¿No tenés cuenta?
                <a id="btn-register" th:href="@{/nuevo-usuario}">Creá una</a>
            </p>
        </section>
    </div>
</main>

<script type="module" th:src="@{js/login.js}"></script>
</body>
</html>
