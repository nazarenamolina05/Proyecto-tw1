<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos</title>
    <link rel="stylesheet" href="/Proyecto-tw1/src/main/webapp/resources/core/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/Proyecto-tw1/src/main/webapp/resources/core/css/home-eventos.css" />
</head>
<body>
<!-- HEADER -->

<header class="encabezado py-3">
    <div class="container">
        <nav class="d-flex justify-content-between align-items-center">
            <a href="#inicio" class="text-light text-decoration-none">
                <span>✦</span>
                <span>Eventos</span>
            </a>

            <ul class="d-flex list-unstyled gap-4 mb-0">
                <li>
                    <a href="#inicio" class="text-light text-decoration-none"
                    >Inicio</a
                    >
                </li>
                <li>
                    <a href="#packs" class="text-light text-decoration-none"
                    >Paquetes</a
                    >
                </li>
                <li>
                    <a href="#tipos-evento" class="text-light text-decoration-none"
                    >Eventos</a
                    >
                </li>
                <li>
                    <a href="#como-funciona" class="text-light text-decoration-none"
                    >Cómo funciona</a
                    >
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <button type="button" class="btn text-light" aria-label="Buscar">
                    🔍
                </button>

                <a href="/login" class="btn btn-outline-light rounded-pill px-4"
                >Ingresar</a
                >
            </div>
        </nav>
    </div>
</header>

<!-- MAIN -->

<main>
    <section id="inicio" class="hero py-5">
        <div class="container">
            <div class="row align-items-center">
                <!-- TEXTO -->
                <div class="col-12 col-lg-7">
                    <h1 class="fw-bold">
                        Organizá tu evento,<br />todo en un solo lugar
                    </h1>

                    <p class="mt-3">
                        Paquetes, proveedores, personalización y más. <br />
                        Encontrá lo que necesitás y hacé realidad tu próximo evento.
                    </p>
                </div>

                <!-- IMAGEN -->
                <div class="col-12 col-lg-5">
                    <img
                            src="/Proyecto-tw1/src/main/webapp/resources/core/img/salon.jpg"
                            class="img-fluid"
                            alt="Salón preparado para un evento"
                    />
                </div>
            </div>

            <!-- BUSCADOR DE PRESUPUESTOS -->

            <form class="row g-3 mt-4 bg-white text-dark p-3 rounded-4">
                <!-- TIPO DE EVENTO -->

                <div class="col-12 col-lg-3">
                    <label for="tipoEvento" class="form-label">
                        Tipo de evento
                    </label>

                    <select id="tipoEvento" name="tipoEvento" class="form-select">
                        <option value="">Seleccioná una opción</option>
                        <option value="casamiento">Casamiento</option>
                        <option value="quince">Fiesta de 15</option>
                        <option value="cumpleanios">Cumpleaños</option>
                    </select>
                </div>

                <!-- PRESUPUESTO -->

                <div class="col-12 col-lg-3">
                    <label for="elegirPresupuesto" class="form-label">
                        Presupuesto
                    </label>

                    <select
                            id="elegirPresupuesto"
                            name="elegirPresupuesto"
                            class="form-select"
                    >
                        <option value="">Seleccioná una opción</option>
                        <option value="100000">$0 - $100.000</option>
                        <option value="250000">$100.001 - $250.000</option>
                        <option value="500000">$250.001 - $500.000</option>
                        <option value="1000000">$500.001 - $1.000.000</option>
                    </select>
                </div>

                <div class="col-12 col-lg-3">
                    <label for="invitados" class="form-label"> Invitados </label>

                    <input
                            id="invitados"
                            name="invitados"
                            class="form-control"
                            type="number"
                            min="1"
                    />
                </div>

                <div class="col-12 col-lg-3 d-flex align-items-center">
                    <button type="submit" class="btn btn-primary w-100">
                        Buscar
                    </button>
                </div>
            </form>
        </div>
    </section>

    <section id="packs"></section>

    <section id="tipos-evento"></section>

    <section id="como-funciona"></section>
</main>
</body>
</html>
