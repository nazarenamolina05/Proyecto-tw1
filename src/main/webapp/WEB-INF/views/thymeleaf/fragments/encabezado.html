<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Header común: cambia según haya o no un usuario logueado.
     Los estilos están en css/encabezado.css (cada página tiene que incluirlo). -->
<header class="encabezado" th:fragment="encabezado">
    <div class="container">
        <nav class="encabezado-nav" aria-label="Principal">
            <!-- Logo: la fuente Great Vibes se carga en el <head> de cada página -->
            <a th:href="@{/home-eventos}" class="encabezado-marca">
                <span class="logo-andy">Eventos Andy</span>
            </a>

            <!-- Solo se ve en pantallas chicas: abre y cierra el menú -->
            <button type="button" class="encabezado-boton-menu"
                    aria-controls="encabezado-menu" aria-expanded="false" aria-label="Abrir menú">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>

            <div id="encabezado-menu" class="encabezado-menu">
                <ul class="encabezado-links">
                    <li><a th:href="@{/home-eventos}">Inicio</a></li>
                    <li><a th:href="@{/paquetes}">Paquetes</a></li>
                    <li><a th:href="@{/home-eventos#como-funciona}">Cómo funciona</a></li>
                </ul>

                <div class="encabezado-acciones">
                    <!-- Sin loguear -->
                    <a th:if="${session.USUARIO == null}" th:href="@{/login}"
                       class="btn btn-outline-light rounded-pill px-4">
                        <i class="bi bi-person me-1" aria-hidden="true"></i>Ingresar
                    </a>

                    <!-- Logueado -->
                    <a th:if="${session.USUARIO != null}" th:href="@{/mis-reservas}"
                       class="btn btn-outline-light rounded-pill px-4">
                        <i class="bi bi-calendar-check me-1" aria-hidden="true"></i>Mis reservas
                    </a>
                    <a th:if="${session.USUARIO != null}" th:href="@{/perfil}"
                        class="btn btn-outline-light rounded-pill px-4">
                         <i class="bi bi-person-circle me-1"></i>Mi perfil
                    </a>
                    <form th:if="${session.USUARIO != null}" th:action="@{/cerrar-sesion}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-light rounded-pill px-4">
                            <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>Cerrar sesión
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </div>

    <!-- Abre/cierra el menú en celular agregando la clase "abierto" al header -->
    <script>
        (function () {
            var encabezado = document.currentScript.closest(".encabezado");
            var boton = encabezado.querySelector(".encabezado-boton-menu");
            boton.addEventListener("click", function () {
                var abierto = encabezado.classList.toggle("abierto");
                boton.setAttribute("aria-expanded", String(abierto));
                boton.setAttribute("aria-label", abierto ? "Cerrar menú" : "Abrir menú");
            });
        })();
    </script>
</header>

</body>
</html>
