<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="modal" class="modal fade" id="modalReservar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Reservar <span id="reservaNombre" th:text="${paquete != null} ? ${paquete.nombre}"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <form id="formReservar" method="post"
                  th:action="${paquete != null} ? @{/paquetes-predeterminados/{id}/reservar(id=${paquete.id})} : '#'">
                <div class="modal-body">

                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

                    <div class="mb-3">
                        <label for="reservaTipoEvento" class="form-label fw-bold">Tipo de evento</label>
                        <select id="reservaTipoEvento" name="tipoEvento" class="form-select" required>
                            <option value="">Seleccioná un tipo</option>
                            <th:block th:each="tipo : ${T(com.tallerwebi.dominio.TipoPaquete).values()}" th:switch="${tipo.name()}">
                                <option th:case="'CUMPLEANIOS'" th:value="${tipo.name()}"
                                        th:selected="${tipoSeleccionado == tipo}">Cumpleaños</option>
                                <option th:case="'FIESTA_DE_15'" th:value="${tipo.name()}"
                                        th:selected="${tipoSeleccionado == tipo}">Fiesta de 15</option>
                                <option th:case="'CASAMIENTO'" th:value="${tipo.name()}"
                                        th:selected="${tipoSeleccionado == tipo}">Casamiento</option>
                                <option th:case="'EMPRESARIAL'" th:value="${tipo.name()}"
                                        th:selected="${tipoSeleccionado == tipo}">Empresarial</option>
                            </th:block>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="reservaFecha" class="form-label fw-bold">Fecha del evento</label>
                        <input id="reservaFecha" name="fecha" type="text" class="form-control"
                               placeholder="Elegí una fecha" th:value="${fechaSeleccionada}" required readonly />
                    </div>

                    <div class="mb-3">
                        <label for="reservaInvitados" class="form-label fw-bold">
                            Cantidad de invitados
                            <span class="text-muted fw-normal">(hasta <span id="reservaCapacidad" th:text="${capacidad}">50</span>)</span>
                        </label>
                        <input id="reservaInvitados" name="cantidadInvitados" type="number"
                               class="form-control" min="1" th:max="${capacidad}"
                               th:value="${invitadosSeleccionados}" required />
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal"><i class="bi bi-x-lg me-1"></i>Cancelar</button>
                    <button type="submit" class="btn btn-pack rounded-pill"><i class="bi bi-check2-circle me-1"></i>Confirmar reserva</button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/es.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script th:inline="javascript">
        const fechasOcupadas = /*[[${fechasOcupadas}]]*/ [];
        const hayError = /*[[${error != null}]]*/ false;
        const modalReservar = document.getElementById("modalReservar");

        flatpickr("#reservaFecha", {
            locale: "es",
            dateFormat: "Y-m-d",
            minDate: new Date().fp_incr(1),
            disable: fechasOcupadas || [],
            onDayCreate: function (dObj, dStr, fp, dayElem) {
                const iso = fp.formatDate(dayElem.dateObj, "Y-m-d");
                if ((fechasOcupadas || []).includes(iso)) {
                    dayElem.classList.add("dia-ocupado");
                    dayElem.title = "Fecha ocupada";
                }
            }
        });

        // Cada botón "Reservar" le pasa al modal los datos de su paquete
        modalReservar.addEventListener("show.bs.modal", function (e) {
            const boton = e.relatedTarget;
            if (!boton) return;
            document.getElementById("formReservar").action = boton.dataset.action;
            document.getElementById("reservaNombre").textContent = boton.dataset.nombre;
            document.getElementById("reservaCapacidad").textContent = boton.dataset.capacidad;
            document.getElementById("reservaInvitados").max = boton.dataset.capacidad;
        });

        if (hayError) {
            new bootstrap.Modal(modalReservar).show();
        }
    </script>
</th:block>

</body>
</html>
