<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title th:text="${hayFiltros} ? 'Resultados de la búsqueda' : 'Todos los paquetes'">Todos los paquetes</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" th:href="@{/css/general.css}" />
    <link rel="stylesheet" th:href="@{/css/encabezado.css}" />
    <link rel="stylesheet" th:href="@{/css/home-eventos.css}" />
</head>

<body>

<!-- HEADER -->
<th:block th:replace="~{fragments/encabezado :: encabezado}"></th:block>

<!-- RESULTADOS -->
<main id="packs" class="seccion-clara py-5">
    <div class="container">

        <!-- TITULO -->
        <div class="mb-4">
            <h1 class="fw-bold mb-1"
                th:text="${hayFiltros} ? 'Resultados de la búsqueda' : 'Todos los paquetes'">
                Todos los paquetes
            </h1>

            <div class="linea-titulo"></div>

            <p class="text-secondary mt-3">
                Explorá los paquetes disponibles para tu evento.
            </p>
        </div>

        <!-- Aviso de publicación (viene en la URL: ?publicado=ok) -->
        <div class="alert alert-success rounded-4" th:if="${param.publicado != null and param.publicado[0] == 'ok'}">
            <i class="bi bi-check-circle-fill me-1"></i>¡Listo! Tu evento ya está publicado como paquete.
        </div>

        <!-- SIN RESULTADOS -->
        <div th:if="${#lists.isEmpty(paquetes)}"
             class="alert alert-info rounded-4">

            No encontramos paquetes que cumplan con los filtros seleccionados.

            <a th:href="@{/home-eventos}"
               class="alert-link">
                Modificar búsqueda
            </a>

        </div>

        <!-- LISTADO DE PAQUETES -->
        <div class="row g-4">

            <div class="col-12 col-md-6 col-lg-4"
                 th:each="paquete : ${paquetes}">

                <th:block th:replace="~{fragments/paquete-card :: paqueteCard(${paquete}, 'ver-mas', true)}"></th:block>

            </div>

        </div>

    </div>
</main>

</body>
</html>
