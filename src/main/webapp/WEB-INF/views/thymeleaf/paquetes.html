<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paquetes</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/home-eventos.css}" />
</head>
<body>
<!-- HEADER -->

<header class="encabezado py-3">
    <div class="container">
        <nav class="d-flex justify-content-between align-items-center">
            <a href="#inicio" class="text-light text-decoration-none">
                <span>✦</span>
                <span>Eventos</span>
            </a>

            <ul class="d-flex list-unstyled gap-4 mb-0">
                <li>
                    <a href="#inicio" class="text-light text-decoration-none"
                    >Inicio</a
                    >
                </li>
                <li>
                    <a href="#packs" class="text-light text-decoration-none"
                    >Paquetes</a
                    >
                </li>
                <li>
                    <a href="#tipos-evento" class="text-light text-decoration-none"
                    >Eventos</a
                    >
                </li>
                <li>
                    <a href="#como-funciona" class="text-light text-decoration-none"
                    >Cómo funciona</a
                    >
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <button type="button" class="btn text-light" aria-label="Buscar">
                    🔍
                </button>

                <a href="/login" class="btn btn-outline-light rounded-pill px-4"
                >Ingresar</a
                >
            </div>
        </nav>
    </div>
</header>
<main class="container py-5">
    <h1 class="fw-bold mb-4">Resultados de la búsqueda</h1>

    <p th:if="${#lists.isEmpty(paquetes)}" class="alert alert-info">
        No se encontraron paquetes para el tipo de evento seleccionado.
    </p>

    <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-4"
             th:each="paquete : ${paquetes}">

            <article class="card h-100 border-0 shadow-sm rounded-4">
                <div class="card-body">
                    <h2 class="h5 fw-bold" th:text="${paquete.nombre}">
                        Nombre del paquete
                    </h2>

                    <p class="mb-0" th:text="${paquete.tipo}">
                        Tipo de evento
                    </p>
                </div>
            </article>

        </div>
    </div>
</main>

</body>
</html>
